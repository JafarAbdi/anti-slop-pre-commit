name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: hook flags slop and passes clean code
        run: |
          printf 'export const bad = (x: object): unknown => x;\n' > bad.ts
          printf 'export const ok = (x: number): number => x;\n' > ok.ts
          ! node scripts/precommit.mjs bad.ts
          node scripts/precommit.mjs ok.ts
      - name: effect hook flags manual _tag comparison
        run: |
          printf 'type R = { _tag: "Ready" } | { _tag: "Idle" };\nexport const isReady = (r: R) => r._tag === "Ready";\n' > tag.ts
          ! node scripts/precommit.mjs --effect tag.ts
          node scripts/precommit.mjs --effect ok.ts
